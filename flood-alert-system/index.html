<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Alerta de Inundação - Bairro Mubungo, Bengo</title>

<!-- ============ BIBLIOTECAS EXTERNAS (via CDN) ============ -->
<!-- Bootstrap 5 (framework CSS/JS para o layout responsivo) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons (ícones usados em todo o sistema) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<!-- Leaflet (biblioteca de mapas, usada com a API gratuita OpenStreetMap) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<!-- Folha de estilos própria do sistema -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- =====================================================================
     ECRÃ DE AUTENTICAÇÃO (Login / Registo / Recuperação de Senha)
     Só é apresentado quando NÃO existe nenhuma sessão iniciada.
     Os campos de e-mail e senha nunca vêm pré-preenchidos.
====================================================================== -->
<div id="tela-autenticacao">
  <div class="card auth-card shadow-lg">
    <div class="auth-cabecalho">
      <i class="bi bi-water logo-app" style="font-size:2.5rem;"></i>
      <h5 class="mb-0" data-i18n="app_titulo"></h5>
    </div>
    <div class="card-body p-4">

      <!-- Seletor de idioma e tema, disponível mesmo antes do login -->
      <div class="d-flex justify-content-end gap-2 mb-3">
        <select class="form-select form-select-sm w-auto seletor-idioma">
          <option value="pt">Português</option>
          <option value="kmb">Kimbundo</option>
        </select>
        <button class="btn btn-sm btn-outline-secondary btn-alternar-tema">
          <i class="bi bi-moon-stars-fill icone-tema"></i>
        </button>
      </div>

      <!-- ---------------- PAINEL DE LOGIN ---------------- -->
      <div id="painel-login">
        <h5 class="mb-3 text-center" data-i18n="login_titulo"></h5>
        <div id="login-erro" class="alert alert-danger d-none"></div>
        <form id="form-login" autocomplete="off">
          <div class="mb-3">
            <label class="form-label" data-i18n="login_email"></label>
            <input type="email" class="form-control" id="login-email" autocomplete="off" required>
          </div>
          <div class="mb-3">
            <label class="form-label" data-i18n="login_senha"></label>
            <input type="password" class="form-control" id="login-senha" autocomplete="new-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-2" data-i18n="login_entrar"></button>
          <div class="d-flex justify-content-between small">
            <a href="#" id="link-ir-registo" data-i18n="login_criar_conta"></a>
            <a href="#" id="link-ir-recuperar" data-i18n="login_esqueci"></a>
          </div>
        </form>
        <hr>
        <p class="small text-muted mb-0">
          <b>Contas de demonstração</b> (senha entre parêntesis):<br>
          admin@bengo.gov.ao (Admin@123) · tecnico@bengo.gov.ao (Tecnico@123)<br>
          voluntario@bengo.gov.ao (Voluntario@123) · usuario@bengo.gov.ao (Usuario@123)
        </p>
      </div>

      <!-- ---------------- PAINEL DE REGISTO ---------------- -->
      <div id="painel-registo" class="d-none">
        <h5 class="mb-3 text-center" data-i18n="registo_titulo"></h5>
        <div id="registo-mensagem" class="alert d-none"></div>
        <form id="form-registo" autocomplete="off">
          <div class="mb-2">
            <label class="form-label" data-i18n="registo_nome"></label>
            <input class="form-control" id="registo-nome" autocomplete="off" required>
          </div>
          <div class="mb-2">
            <label class="form-label" data-i18n="login_email"></label>
            <input type="email" class="form-control" id="registo-email" autocomplete="off" required>
          </div>
          <div class="row">
            <div class="col-6 mb-2">
              <label class="form-label" data-i18n="login_senha"></label>
              <input type="password" class="form-control" id="registo-senha" autocomplete="new-password" required>
            </div>
            <div class="col-6 mb-2">
              <label class="form-label" data-i18n="registo_confirmar_senha"></label>
              <input type="password" class="form-control" id="registo-confirmar-senha" autocomplete="new-password" required>
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label" data-i18n="registo_telefone"></label>
            <input class="form-control" id="registo-telefone" autocomplete="off">
          </div>
          <div class="mb-2">
            <label class="form-label" data-i18n="registo_pergunta"></label>
            <select class="form-select" id="registo-pergunta">
              <option>Qual é o nome do seu bairro?</option>
              <option>Qual é o nome do seu animal de estimação?</option>
              <option>Qual é a sua comida preferida?</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label" data-i18n="registo_resposta"></label>
            <input class="form-control" id="registo-resposta" autocomplete="off" required>
          </div>
          <div class="mb-3">
            <label class="form-label" data-i18n="registo_foto"></label>
            <input type="file" class="form-control" id="registo-foto" accept="image/*">
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-2" data-i18n="registo_criar"></button>
          <div class="text-center">
            <a href="#" id="link-voltar-login-1" data-i18n="registo_voltar"></a>
          </div>
        </form>
      </div>

      <!-- ---------------- PAINEL DE RECUPERAÇÃO DE SENHA ---------------- -->
      <div id="painel-recuperar" class="d-none">
        <h5 class="mb-3 text-center" data-i18n="recuperar_titulo"></h5>

        <div id="bloco-recuperar-passo1">
          <div id="recuperar-erro-1" class="alert alert-danger d-none"></div>
          <form id="form-recuperar-passo1" autocomplete="off">
            <div class="mb-3">
              <label class="form-label" data-i18n="login_email"></label>
              <input type="email" class="form-control" id="recuperar-email" autocomplete="off" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2" data-i18n="recuperar_procurar"></button>
          </form>
        </div>

        <div id="bloco-recuperar-passo2" class="d-none">
          <div id="recuperar-erro-2" class="alert alert-danger d-none"></div>
          <form id="form-recuperar-passo2" autocomplete="off">
            <input type="hidden" id="recuperar-email-oculto">
            <div class="mb-2">
              <label class="form-label">Pergunta de segurança</label>
              <p class="fw-semibold" id="recuperar-pergunta-texto"></p>
            </div>
            <div class="mb-2">
              <input class="form-control" id="recuperar-resposta" placeholder="A sua resposta" required>
            </div>
            <div class="mb-2">
              <label class="form-label" data-i18n="recuperar_nova_senha"></label>
              <input type="password" class="form-control" id="recuperar-nova-senha" autocomplete="new-password" required>
            </div>
            <div class="mb-3">
              <label class="form-label" data-i18n="recuperar_confirmar"></label>
              <input type="password" class="form-control" id="recuperar-confirmar-senha" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2" data-i18n="recuperar_redefinir"></button>
          </form>
        </div>

        <div class="text-center">
          <a href="#" id="link-voltar-login-2" data-i18n="registo_voltar"></a>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- =====================================================================
     APLICAÇÃO PRINCIPAL (visível apenas após autenticação)
====================================================================== -->
<div id="tela-aplicacao" class="d-none">

  <!-- ---------------- MENU LATERAL (ESCONDIDO, aparece ao passar o cursor) ---------------- -->
  <nav id="sidebar">
    <div class="p-3 border-bottom border-secondary-subtle d-flex align-items-center gap-2">
      <i class="bi bi-water text-info fs-4"></i>
      <span class="sidebar-texto text-white fw-semibold">Alerta Mubungo</span>
    </div>
    <div class="px-3 py-2">
      <span class="badge text-bg-info" id="sidebar-badge-role">-</span>
    </div>
    <div class="nav flex-column" id="menu-lateral-nav"></div>
  </nav>

  <!-- ---------------- CONTEÚDO PRINCIPAL ---------------- -->
  <div class="flex-grow-1 d-flex flex-column">

    <!-- Barra superior: idioma, tema, dados do usuário e botão de logout reposicionado -->
    <header id="topbar">
      <select class="form-select form-select-sm w-auto seletor-idioma">
        <option value="pt">Português</option>
        <option value="kmb">Kimbundo</option>
      </select>

      <button class="btn btn-sm btn-outline-secondary btn-alternar-tema" title="Mudar tema">
        <i class="bi bi-moon-stars-fill icone-tema"></i>
      </button>

      <div class="d-flex align-items-center gap-2">
        <img id="topbar-foto-usuario" src="assets/icons/avatar-padrao.svg" class="rounded-circle" style="width:36px;height:36px;object-fit:cover;">
        <span id="topbar-nome-usuario" class="fw-semibold small"></span>
      </div>

      <!-- BOTÃO DE LOGOUT: posição alterada para o extremo direito, destacado e isolado -->
      <button id="btn-logout" class="btn btn-danger btn-sm">
        <i class="bi bi-box-arrow-right"></i> <span data-i18n="menu_sair"></span>
      </button>
    </header>

    <main id="conteudo-principal"></main>
  </div>
</div>

<!-- ============ SCRIPTS ============ -->
<!-- Bootstrap JS (necessário para modais, dropdowns, etc.) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Leaflet JS (mapas) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Scripts próprios do sistema, na ordem correta de dependências -->
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/i18n.js"></script>
<script src="js/theme.js"></script>
<script src="js/users.js"></script>
<script src="js/sensors.js"></script>
<script src="js/boletins.js"></script>
<script src="js/relatorios.js"></script>
<script src="js/mensagens.js"></script>
<script src="js/map.js"></script>
<script src="js/modules.js"></script>
<script src="js/app.js"></script>
</body>
</html>
