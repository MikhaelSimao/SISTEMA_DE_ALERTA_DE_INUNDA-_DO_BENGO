<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Arial, sans-serif">
  <style>
    .titulo { font-size: 20px; font-weight: bold; fill: #0b2545; }
    .ator-nome { font-size: 13px; fill: #0b2545; font-weight: 600; text-anchor: middle; }
    .caso { fill: #ffffff; stroke: #0d6efd; stroke-width: 2; }
    .caso-texto { font-size: 12px; fill: #0b2545; text-anchor: middle; }
    .linha { stroke: #6c757d; stroke-width: 1.5; }
    .inclui { stroke: #6c757d; stroke-width: 1.2; stroke-dasharray: 5,3; fill: none; }
    .inclui-texto { font-size: 10px; fill: #6c757d; font-style: italic; }
  </style>

  <text x="600" y="30" text-anchor="middle" class="titulo">Diagrama de Caso de Uso Geral - Sistema de Alerta de Inundação (Bairro Mubungo)</text>

  <!-- Limite do sistema -->
  <rect x="230" y="55" width="750" height="690" rx="12" fill="#f4f8ff" stroke="#0b2545" stroke-width="2"/>
  <text x="605" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b2545">Sistema de Alerta de Inundação</text>

  <!-- ================= ATORES (esquerda) ================= -->
  <!-- Administrador -->
  <g id="ator-admin">
    <circle cx="60" cy="130" r="12" fill="none" stroke="#0b2545" stroke-width="2"/>
    <line x1="60" y1="142" x2="60" y2="180" class="linha"/>
    <line x1="35" y1="158" x2="85" y2="158" class="linha"/>
    <line x1="60" y1="180" x2="40" y2="205" class="linha"/>
    <line x1="60" y1="180" x2="80" y2="205" class="linha"/>
    <text x="60" y="222" class="ator-nome">Administrador</text>
  </g>

  <!-- Técnico -->
  <g id="ator-tecnico">
    <circle cx="60" cy="260" r="12" fill="none" stroke="#0b2545" stroke-width="2"/>
    <line x1="60" y1="272" x2="60" y2="310" class="linha"/>
    <line x1="35" y1="288" x2="85" y2="288" class="linha"/>
    <line x1="60" y1="310" x2="40" y2="335" class="linha"/>
    <line x1="60" y1="310" x2="80" y2="335" class="linha"/>
    <text x="60" y="352" class="ator-nome">Técnico</text>
  </g>

  <!-- Voluntário -->
  <g id="ator-voluntario">
    <circle cx="60" cy="400" r="12" fill="none" stroke="#0b2545" stroke-width="2"/>
    <line x1="60" y1="412" x2="60" y2="450" class="linha"/>
    <line x1="35" y1="428" x2="85" y2="428" class="linha"/>
    <line x1="60" y1="450" x2="40" y2="475" class="linha"/>
    <line x1="60" y1="450" x2="80" y2="475" class="linha"/>
    <text x="60" y="492" class="ator-nome">Voluntário</text>
  </g>

  <!-- Usuário (Morador) -->
  <g id="ator-usuario">
    <circle cx="60" cy="540" r="12" fill="none" stroke="#0b2545" stroke-width="2"/>
    <line x1="60" y1="552" x2="60" y2="590" class="linha"/>
    <line x1="35" y1="568" x2="85" y2="568" class="linha"/>
    <line x1="60" y1="590" x2="40" y2="615" class="linha"/>
    <line x1="60" y1="590" x2="80" y2="615" class="linha"/>
    <text x="60" y="632" class="ator-nome">Usuário (Morador)</text>
  </g>

  <!-- ================= ATOR (direita) - Hardware ================= -->
  <g id="ator-sensor">
    <rect x="1090" y="330" width="70" height="46" rx="6" fill="#fff3cd" stroke="#997404" stroke-width="1.5"/>
    <text x="1125" y="350" text-anchor="middle" font-size="10" fill="#664d03">Arduino Uno</text>
    <text x="1125" y="363" text-anchor="middle" font-size="10" fill="#664d03">/ ESP32</text>
    <text x="1125" y="400" class="ator-nome">Sensor Físico</text>
  </g>

  <!-- ================= CASOS DE USO ================= -->
  <!-- Coluna 1 -->
  <ellipse cx="330" cy="120" rx="80" ry="28" class="caso"/><text x="330" y="124" class="caso-texto">Autenticar-se (Login)</text>
  <ellipse cx="330" cy="185" rx="90" ry="28" class="caso"/><text x="330" y="182" class="caso-texto">Criar Conta / Recuperar</text><text x="330" y="196" class="caso-texto">Senha</text>
  <ellipse cx="330" cy="250" rx="85" ry="28" class="caso"/><text x="330" y="254" class="caso-texto">Gerir Usuários</text>
  <ellipse cx="330" cy="315" rx="90" ry="28" class="caso"/><text x="330" y="312" class="caso-texto">Configurar Sensores</text><text x="330" y="326" class="caso-texto">(Real / Simulação)</text>
  <ellipse cx="330" cy="385" rx="85" ry="28" class="caso"/><text x="330" y="382" class="caso-texto">Criar e Buscar</text><text x="330" y="396" class="caso-texto">Boletim</text>
  <ellipse cx="330" cy="450" rx="90" ry="28" class="caso"/><text x="330" y="447" class="caso-texto">Emitir e Pesquisar</text><text x="330" y="461" class="caso-texto">Relatório</text>

  <!-- Coluna 2 -->
  <ellipse cx="530" cy="150" rx="85" ry="28" class="caso"/><text x="530" y="147" class="caso-texto">Visualizar Painel /</text><text x="530" y="161" class="caso-texto">Nível de Água</text>
  <ellipse cx="530" cy="215" rx="85" ry="28" class="caso"/><text x="530" y="219" class="caso-texto">Ver Mapa de Risco</text>
  <ellipse cx="530" cy="280" rx="90" ry="28" class="caso"/><text x="530" y="277" class="caso-texto">Consultar Alertas</text><text x="530" y="291" class="caso-texto">(Consulta Pública)</text>
  <ellipse cx="510" cy="345" rx="80" ry="28" class="caso"/><text x="510" y="349" class="caso-texto">Imprimir Relatório</text>
  <ellipse cx="670" cy="320" rx="55" ry="20" class="caso"/><text x="670" y="318" class="caso-texto">via Wi-Fi</text>
  <ellipse cx="670" cy="370" rx="65" ry="20" class="caso"/><text x="670" y="368" class="caso-texto">via Bluetooth</text>
  <ellipse cx="530" cy="415" rx="90" ry="28" class="caso"/><text x="530" y="412" class="caso-texto">Registar e Enviar</text><text x="530" y="426" class="caso-texto">Mensagem de Suporte</text>
  <ellipse cx="530" cy="480" rx="90" ry="28" class="caso"/><text x="530" y="477" class="caso-texto">Mudar Tema /</text><text x="530" y="491" class="caso-texto">Trocar Idioma</text>
  <ellipse cx="530" cy="545" rx="90" ry="28" class="caso"/><text x="530" y="542" class="caso-texto">Editar Perfil</text><text x="530" y="556" class="caso-texto">(Foto de Perfil)</text>

  <!-- Caso de uso do sensor -->
  <ellipse cx="870" cy="345" rx="100" ry="28" class="caso"/><text x="870" y="342" class="caso-texto">Enviar Leitura de</text><text x="870" y="356" class="caso-texto">Nível de Água</text>
  <ellipse cx="870" cy="440" rx="95" ry="28" class="caso"/><text x="870" y="437" class="caso-texto">Emitir Beep de Alerta</text><text x="870" y="451" class="caso-texto">(modo offline)</text>

  <!-- ================= LIGAÇÕES ATOR -> CASO DE USO ================= -->
  <line x1="95" y1="130" x2="250" y2="120" class="linha"/>
  <line x1="95" y1="135" x2="245" y2="185" class="linha"/>
  <line x1="95" y1="140" x2="248" y2="250" class="linha"/>

  <line x1="95" y1="260" x2="245" y2="315" class="linha"/>
  <line x1="95" y1="255" x2="248" y2="385" class="linha"/>
  <line x1="95" y1="265" x2="447" y2="150" class="linha"/>
  <line x1="95" y1="270" x2="447" y2="215" class="linha"/>

  <line x1="95" y1="400" x2="248" y2="450" class="linha"/>
  <line x1="95" y1="405" x2="447" y2="345" class="linha"/>
  <line x1="95" y1="410" x2="447" y2="480" class="linha"/>

  <line x1="95" y1="540" x2="248" y2="385" class="linha"/>
  <line x1="95" y1="545" x2="248" y2="450" class="linha"/>
  <line x1="95" y1="550" x2="447" y2="280" class="linha"/>
  <line x1="95" y1="555" x2="447" y2="415" class="linha"/>
  <line x1="95" y1="560" x2="447" y2="545" class="linha"/>
  <line x1="95" y1="530" x2="245" y2="120" class="linha"/>

  <line x1="1090" y1="350" x2="965" y2="345" class="linha"/>
  <line x1="1090" y1="365" x2="960" y2="440" class="linha"/>

  <!-- Relações de dependência (<<include>>) -->
  <path d="M 545 330 L 630 322" class="inclui"/><text x="560" y="315" class="inclui-texto">&lt;&lt;include&gt;&gt;</text>
  <path d="M 545 360 L 620 368" class="inclui"/>
  <path d="M 725 320 L 800 340" class="inclui"/>
  <path d="M 725 370 L 800 400" class="inclui"/>
  <path d="M 870 373 L 870 412" class="inclui"/><text x="815" y="405" class="inclui-texto">&lt;&lt;include&gt;&gt;</text>

  <text x="600" y="758" text-anchor="middle" font-size="11" fill="#6c757d">Nota: apenas o Administrador possui acesso obrigatório a todos os módulos do sistema.</text>
</svg>
