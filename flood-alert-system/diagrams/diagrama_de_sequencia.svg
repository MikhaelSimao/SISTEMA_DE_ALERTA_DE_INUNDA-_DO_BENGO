<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 720" font-family="Arial, sans-serif">
  <style>
    .titulo { font-size: 19px; font-weight: bold; fill: #0b2545; }
    .ator-caixa { fill: #eaf2ff; stroke: #0d6efd; stroke-width: 1.6; }
    .ator-texto { font-size: 12px; font-weight: bold; text-anchor: middle; fill: #0b2545; }
    .linha-vida { stroke: #adb5bd; stroke-width: 1.4; stroke-dasharray: 4,3; }
    .msg { stroke: #0b2545; stroke-width: 1.6; fill: none; marker-end: url(#seta); }
    .msg-retorno { stroke: #6c757d; stroke-width: 1.4; fill: none; stroke-dasharray: 5,3; marker-end: url(#seta-cinza); }
    .msg-texto { font-size: 10.5px; fill: #0b2545; }
    .ativacao { fill: #d6e4ff; stroke: #0d6efd; }
    .nota { fill: #fff9db; stroke: #997404; stroke-width: 1; }
    .nota-texto { font-size: 9.5px; fill: #664d03; }
  </style>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0b2545"/></marker>
    <marker id="seta-cinza" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6c757d"/></marker>
  </defs>

  <text x="525" y="26" text-anchor="middle" class="titulo">Diagrama de Sequência - Deteção e Emissão de Alerta de Inundação (Modo Real)</text>

  <!-- ================= ATORES / OBJETOS (topo) ================= -->
  <!-- Sensor Real -->
  <rect x="30" y="50" width="140" height="36" rx="4" class="ator-caixa"/>
  <text x="100" y="72" class="ator-texto">Sensor (Arduino/ESP32)</text>
  <line x1="100" y1="86" x2="100" y2="660" class="linha-vida"/>

  <!-- Módulo sensors.js -->
  <rect x="230" y="50" width="150" height="36" rx="4" class="ator-caixa"/>
  <text x="305" y="72" class="ator-texto">Módulo Sensores</text>
  <line x1="305" y1="86" x2="305" y2="660" class="linha-vida"/>

  <!-- Base de dados -->
  <rect x="440" y="50" width="150" height="36" rx="4" class="ator-caixa"/>
  <text x="515" y="72" class="ator-texto">Base de Dados</text>
  <line x1="515" y1="86" x2="515" y2="660" class="linha-vida"/>

  <!-- Interface -->
  <rect x="650" y="50" width="150" height="36" rx="4" class="ator-caixa"/>
  <text x="725" y="72" class="ator-texto">Interface (Painel)</text>
  <line x1="725" y1="86" x2="725" y2="660" class="linha-vida"/>

  <!-- Utilizador -->
  <rect x="870" y="50" width="140" height="36" rx="4" class="ator-caixa"/>
  <text x="940" y="72" class="ator-texto">Utilizador</text>
  <line x1="940" y1="86" x2="940" y2="660" class="linha-vida"/>

  <!-- ================= MENSAGENS ================= -->
  <!-- 1. Sensor envia leitura -->
  <rect x="95" y="110" width="10" height="500" class="ativacao"/>
  <line x1="100" y1="120" x2="300" y2="120" class="msg"/>
  <text x="110" y="114" class="msg-texto">1: Serial.println({"nivel": 0.87})</text>

  <!-- 2. Módulo Sensores processa e atualiza nível -->
  <rect x="300" y="120" width="10" height="90" class="ativacao"/>
  <line x1="310" y1="140" x2="510" y2="140" class="msg"/>
  <text x="320" y="134" class="msg-texto">2: atualizarNivel(sensorId, nivel, 'real')</text>

  <!-- 3. Base de dados grava leitura -->
  <rect x="510" y="140" width="10" height="60" class="ativacao"/>
  <line x1="520" y1="160" x2="310" y2="160" class="msg-retorno"/>
  <text x="330" y="154" class="msg-texto">3: leitura registada com sucesso</text>

  <!-- 4. Módulo verifica limiar de alerta -->
  <line x1="305" y1="185" x2="305" y2="185" class="msg"/>
  <text x="315" y="185" class="msg-texto">4: verificarAlerta(sensor) [nivel &gt;= limiteAlerta?]</text>

  <!-- 5. Se offline: emitir beep local -->
  <rect x="820" y="205" width="200" height="30" class="nota"/>
  <text x="920" y="225" text-anchor="middle" class="nota-texto">alt: se navigator.onLine === false</text>
  <line x1="310" y1="235" x2="935" y2="235" class="msg"/>
  <text x="330" y="229" class="msg-texto">5: emitirBeep() via Web Audio API</text>

  <!-- 6. Interface é notificada do evento -->
  <line x1="310" y1="265" x2="720" y2="265" class="msg"/>
  <text x="330" y="259" class="msg-texto">6: dispatchEvent('flood:leitura-atualizada')</text>

  <!-- 7. Interface recarrega painel -->
  <rect x="720" y="265" width="10" height="60" class="ativacao"/>
  <line x1="730" y1="290" x2="935" y2="290" class="msg"/>
  <text x="740" y="284" class="msg-texto">7: navegarPara('painel') - atualiza cartões e mapa</text>

  <!-- 8. Utilizador visualiza alerta -->
  <rect x="935" y="290" width="10" height="40" class="ativacao"/>
  <text x="750" y="325" class="msg-texto">8: Utilizador visualiza estado "ALERTA/CRÍTICO" e ouve o beep</text>

  <!-- 9. Emissão de relatório pelo utilizador -->
  <line x1="940" y1="370" x2="730" y2="370" class="msg"/>
  <text x="750" y="364" class="msg-texto">9: emitirRelatorio(ocorrência)</text>
  <rect x="720" y="370" width="10" height="60" class="ativacao"/>
  <line x1="720" y1="395" x2="520" y2="395" class="msg"/>
  <text x="540" y="389" class="msg-texto">10: FloodRelatorios.emitir(dados)</text>
  <rect x="510" y="395" width="10" height="30" class="ativacao"/>
  <line x1="510" y1="415" x2="720" y2="415" class="msg-retorno"/>
  <text x="540" y="410" class="msg-texto">11: relatório guardado</text>

  <!-- 12. Técnico consulta e atualiza estado -->
  <line x1="940" y1="460" x2="730" y2="460" class="msg"/>
  <text x="620" y="454" class="msg-texto">12: pesquisarRelatorios() / atualizarStatus('Em Análise')</text>
  <rect x="720" y="460" width="10" height="40" class="ativacao"/>
  <line x1="720" y1="480" x2="520" y2="480" class="msg"/>
  <rect x="510" y="480" width="10" height="20" class="ativacao"/>

  <!-- 13. Impressão do relatório -->
  <line x1="940" y1="540" x2="730" y2="540" class="msg"/>
  <text x="750" y="534" class="msg-texto">13: imprimirRelatorio(via Wi-Fi ou Bluetooth)</text>
  <rect x="720" y="540" width="10" height="30" class="ativacao"/>

  <text x="525" y="695" text-anchor="middle" font-size="11" fill="#6c757d">
    Fluxo completo desde a leitura real do sensor até à emissão, análise e impressão de um relatório de ocorrência.
  </text>
</svg>
